# Eval Scenario: scan-secrets
# Tests the forge scan verb's ability to detect hardcoded secrets.
# ADR-005, ADR-013

id: scan-secrets
version: "1"
verb: scan
description: |
  Verify that `forge scan` detects common secret anti-patterns:
  hardcoded API keys, passwords in source, and private key material.

inputs:
  files:
    - path: test.go
      content: |
        package main

        const apiKey = "sk-ant-api03-abc123"
        const dbPassword = "s3cr3tpassword"
        var privateKey = "-----BEGIN RSA PRIVATE KEY-----"

        func main() {}

expect:
  findings_min: 3
  finding_ids:
    - FORGE-SEC-001  # hardcoded API key
    - FORGE-SEC-002  # hardcoded password
    - FORGE-SEC-003  # private key material
  exit_code: 0

tags:
  - secrets
  - security
  - scanner
