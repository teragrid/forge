api_version: forge.sh/v1
kind: EvalScenario
metadata:
  id: new-app
  description: >
    Verifies that `forge new go-service <path>` scaffolds a valid project and
    that `forge doctor` reports a healthy workspace immediately afterward
    (DEV-M0-24). Ensures scaffold → doctor handoff is regression-free.
  owner: quality-wg
  labels:
    milestone: M0
    priority: P0
spec:
  inputs:
    workspace_fixture: ""   # uses a temporary directory created by the harness
    forge_version: ">=0.1.0"
    env:
      FORGE_LLM_PROVIDER: openai
      FORGE_LLM_MODEL: gpt-4o-mini
      FORGE_TELEMETRY_ENABLED: "false"
  determinism:
    seed: 7
    cassette: cassettes/new-app.har
    cassette_sha256: ""   # populated by CI on first record run
  steps:
    - id: scaffold-new-service
      run: forge new go-service {{tmp_dir}}/my-service
      expect:
        exit_code: 0
        stdout_contains: ["scaffold ok", "my-service"]
        artifacts:
          - path: "{{tmp_dir}}/my-service/go.mod"
          - path: "{{tmp_dir}}/my-service/.forge/manifest.yml"
    - id: doctor-check
      run: forge doctor --root {{tmp_dir}}/my-service --json
      expect:
        exit_code: 0
        stdout_contains: ["\"status\""]
        stdout_json_schema: schemas/doctor-result.schema.json
    - id: no-scratch-files
      run: forge clean --root {{tmp_dir}}/my-service --dry-run
      expect:
        exit_code: 0
        stdout_contains: ["hygiene ok"]
  oracles:
    - name: token-budget
      max_tokens: 4000
    - name: latency-budget
      max_seconds: 120
    - name: no-credential-leak
      regex_disallow:
        - "sk-[A-Za-z0-9]{20,}"
        - "AKIA[0-9A-Z]{16}"
  quarantine:
    quorum: 3
    threshold_disagree: 1
