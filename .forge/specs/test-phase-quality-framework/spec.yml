slug: test-phase-quality-framework
title: "Test Phase Quality Framework"
rfc_ref: "RFC-005 §6"
phase_scope: [P1, P2]
date: "2026-06-02"
status: spec

acceptance_criteria:
  # P1
  - id: AC-001
    phase: P1
    summary: "TestFrameworkContext struct with Language/TestRunner/AssertionStyle/MockLibrary/CoverageCmd/FuzzSupport/IntegTestDir/FixtureDir/ExistingTests fields"
  - id: AC-002
    phase: P1
    summary: "detectTestFramework(root) — deterministic, zero LLM, Go/Python/TypeScript/Java detection"
  - id: AC-003
    phase: P1
    summary: "Test checkpoint system prompt enriched with TestFrameworkContext; framework-specific stubs (no cross-language injection)"
  - id: AC-004
    phase: P1
    summary: "Bug-fix signals detected → D7 mandatory ≥8; two Regression-labeled stubs generated"
  - id: AC-005
    phase: P1
    summary: "gate_status WARNING when any D1–D9 dimension uncovered; pipeline does not block in P1"
  - id: AC-006
    phase: P1
    summary: "Go projects produce *_test.go only; TS projects produce .test.ts only (G10 regression fix)"
  # P2
  - id: AC-007
    phase: P2
    summary: "9-dimension scoring rubric: weights + thresholds per §6.2; composite = Σ(score_i × weight_i) / Σ(weight_i)"
  - id: AC-008
    phase: P2
    summary: "Pipeline BLOCK when composite < 6.5 OR any weight≥1.5 dimension below threshold"
  - id: AC-009
    phase: P2
    summary: "T0 waives D5/D6/D8 with justification; T2 raises D6 to ≥9"
  - id: AC-010
    phase: P2
    summary: "traceability.yaml written with feature/generated/spec_version/matrix[]/coverage_summary per RFC §6.5"
  - id: AC-011
    phase: P2
    summary: "3-role parallel test review (QA Architect + Security Tester + Reliability Tester), 1 round, synthesis required"
  - id: AC-012
    phase: P2
    summary: "CI Alignment Check: file-presence verification for all matrix test paths; coverage snippet emitted"
  - id: AC-013
    phase: P2
    summary: "ship.run_tests_on_verify=true executes coverage command; exit≠0 → gap list → remediation loop"
  - id: AC-014
    phase: P2
    summary: "ship.test_debate_threshold config key skips 3-role debate for T0 tier (single QA Architect pass)"

nfr:
  - target: "detectTestFramework < 50ms (pure filesystem)"
  - target: "WriteTraceability < 200ms"
  - target: "3-role debate overhead ~6500 tokens"
  - target: "composite score computation < 5ms"

out_of_scope:
  - "Fuzz test stub auto-generation (RFC §6.7) — P3"
  - "Approval workflow changes — P4"
