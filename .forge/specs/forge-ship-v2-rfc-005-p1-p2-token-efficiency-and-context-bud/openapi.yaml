openapi: 3.1.0
info:
  title: Forge Ship V2 API
  version: 2.0.0
paths:
  /api/v1/token-efficiency:
    post:
      summary: Optimize token usage
      operationId: optimizeTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: Text input to be token-optimized.
      responses:
        '200':
          description: Token optimization completed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  optimized_tokens:
                    type: string
                    description: Result after token optimization.
  /api/v1/context-budget:
    post:
      summary: Adjust context utilization
      operationId: adjustContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: string
                  description: Conversation history or context to adjust.
      responses:
        '200':
          description: Context adjustment completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trimmed_context:
                    type: string
                    description: Optimized and prioritized context.
securitySchemes:
  supabaseAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT