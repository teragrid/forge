schema_version: 1
id: langchain-agents-template
feature: add langchain-agents scaffold template to forge new
status: draft
created_at: "2026-05-19T00:00:00Z"

acceptance_criteria:
  - "forge new my-agents --template langchain-agents exits 0 and creates the expected directory tree"
  - "The generated project passes forge doctor with no errors"
  - "go test ./internal/scaffold/... continues to pass after the template is added"
  - "forge scan security in the generated project finds no critical vulnerabilities"
  - "forge scan prompt-injection reports green for the included guardrail"
  - "The .github/workflows/ci.yml template includes jobs: typecheck, lint, test, security"
  - "All Python package directories include __init__.py"
  - "pytest -x passes on a fresh checkout with mocked LLM calls (no API keys required)"
  - "ROLLBACK.md provides working SQL to query LangGraph checkpoints"
  - "forge ship correctly extracts agents, tools, and memory_backend fields into spec.yml"

scan_policy:
  families:
    - secrets
    - sca
    - sast
    - prompt-injection
    - supply-chain

agents:
  - orchestrator
  - researcher
  - executor

tools:
  - web_search
  - vector_store_retrieval

graph_nodes:
  - orchestrator
  - researcher
  - executor

memory_backend: pgvector

events_emitted:
  - AgentStepCompleted
  - WorkflowCompleted
  - PromptInjectionBlocked

authz_model: >
  workspace_id scoped; row-level isolation enforced via pgvector metadata filter
  and validated by convention workspace-id-filter (convention #9 in .forge/conventions.json)

out_of_scope:
  - Production-ready LLM provider connectors beyond OpenAI and Anthropic
  - MCP (Model Context Protocol) integration
  - UI / front-end scaffolding
  - Kubernetes deployment manifests
  - Fine-tuning or model training pipelines

