name: install-test

# Verifies that the published @forgeone/cli npm package installs and runs
# cleanly on every supported OS / install vector. This is the regression
# safety net for the npm publish flow — runs nightly (cheap, ubuntu only on
# the per-PR path; the matrix runs once a day).
#
# Trigger manually with workflow_dispatch to validate a fresh release.

on:
  schedule:
    - cron: '0 4 * * *'        # daily 04:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version of @forgeone/cli to test (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-global:
    name: ${{ matrix.os }} · global install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install @forgeone/cli (global)
        shell: bash
        run: npm install -g @forgeone/cli@${{ github.event.inputs.version || 'latest' }}

      - name: forge version
        shell: bash
        run: forge version

      - name: forge --help (smoke)
        shell: bash
        run: forge --help

      - name: forge doctor (smoke, allow non-zero)
        shell: bash
        run: forge doctor || true

  install-local:
    name: ${{ matrix.os }} · local install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: init throwaway project
        shell: bash
        run: |
          mkdir install-test
          cd install-test
          npm init -y

      - name: install @forgeone/cli locally
        shell: bash
        working-directory: install-test
        run: npm install @forgeone/cli@${{ github.event.inputs.version || 'latest' }}

      - name: run via npx
        shell: bash
        working-directory: install-test
        run: npx forge version

  install-npx:
    name: ${{ matrix.os }} · npx (no install)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npx @forgeone/cli version
        shell: bash
        run: npx --yes @forgeone/cli@${{ github.event.inputs.version || 'latest' }} version
