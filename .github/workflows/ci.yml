# Forge CI — DEV-M0-01 / DEV-M0-05 (ADR-001 stack baseline)
#
# Gates wired here are the pre-merge contract for every PR. Adding/removing a
# gate requires an ADR amendment.
#
# Budget note: this workflow runs only ubuntu-latest runners (free for private
# repos up to the monthly minute cap) to keep Actions costs low.
# Cross-OS tests (macOS 10×, Windows 2× rate) live in nightly.yml instead.

name: ci

on:
  # Only run on pull requests — the pre-push hook (gofmt, vet, test, govulncheck)
  # already gates all quality checks before any commit reaches main, so re-running
  # the full matrix on every push burns Actions minutes without added safety.
  pull_request:
    branches: [main]
  # Allow manual re-runs from the Actions tab for debugging.
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  CGO_ENABLED: '0'

jobs:
  lint:
    name: lint (golangci-lint + gofmt + goimports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: gofmt + goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          gofmt -s -w . || true
          goimports -w -local github.com/teragrid/forge . || true
          # Check for real formatting differences (ignores bare CRLF checkout noise).
          diff=$(git diff --ignore-cr-at-eol -- '*.go')
          if [ -n "$diff" ]; then
            echo 'Formatting issues -- run gofmt -s -w . and goimports -w . then commit'
            git diff --ignore-cr-at-eol --name-only -- '*.go'
            exit 1
          fi
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout=5m

  test:
    name: test (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: go mod verify
        run: go mod verify
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: run tests
        # -race requires CGO / gcc, both available by default on ubuntu-latest.
        # Kept off here anyway to match nightly.yml's dedicated race job and
        # avoid doubling every PR's CI time; -race still runs there nightly.
        run: gotestsum --format pkgname -- -count=1 ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...

  build:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          ver="${GITHUB_SHA:0:7}"
          go build -ldflags "-s -w -X main.Version=$ver" -o "dist/forge-$GOOS-$GOARCH$ext" ./cmd/forge
      - uses: actions/upload-artifact@v7
        with:
          name: forge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/forge-*
          if-no-files-found: error
