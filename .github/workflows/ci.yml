# Forge CI — DEV-M0-01 / DEV-M0-05 (ADR-001 stack baseline)
#
# Gates wired here are the pre-merge contract for every PR. Adding/removing a
# gate requires an ADR amendment.
#
# Budget note: this workflow runs only ubuntu-latest runners (free for private
# repos up to the monthly minute cap) to keep Actions costs low.
# Cross-OS tests (macOS 10×, Windows 2× rate) live in nightly.yml instead.

name: ci

on:
  # Only run on pull requests — the pre-push hook (gofmt, vet, test, govulncheck)
  # already gates all quality checks before any commit reaches main, so re-running
  # the full matrix on every push burns Actions minutes without added safety.
  pull_request:
    branches: [main]
  # Allow manual re-runs from the Actions tab for debugging.
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All steps use PowerShell (default on Windows self-hosted runner).
# bash-style commands have been rewritten as pwsh equivalents.
# TODO: revert runs-on to ubuntu-latest and restore bash steps when budget resets.

env:
  GO_VERSION: '1.26'
  CGO_ENABLED: '0'

jobs:
  lint:
    name: lint (golangci-lint + gofmt + goimports)
    runs-on: [self-hosted, Windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: gofmt + goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          # gofmt exits non-zero on unparseable fixture stubs; try/catch suppresses
          # the NativeCommandError that $ErrorActionPreference='Stop' would throw.
          try { gofmt -s -w . 2>$null } catch {}
          try { goimports -w -local github.com/teragrid/forge . 2>$null } catch {}
          # Check for real formatting differences (ignores bare CRLF checkout noise).
          $diff = git diff --ignore-cr-at-eol -- '*.go'
          if ($diff) {
            Write-Host 'Formatting issues -- run gofmt -s -w . and goimports -w . then commit'
            git diff --ignore-cr-at-eol --name-only -- '*.go'
            exit 1
          }
          exit 0
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout=5m

  test:
    name: test (go test) on self-hosted
    runs-on: [self-hosted, Windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: go mod verify
        run: go mod verify
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: run tests
        # -race requires CGO / gcc; omitted here since self-hosted runner is Windows.
        # Race detection runs in nightly.yml on GitHub-hosted ubuntu-latest.
        run: gotestsum --format pkgname -- -count=1 ./...

  vuln:
    name: govulncheck
    runs-on: [self-hosted, Windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...

  build:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: [self-hosted, Windows, x64]
    # cross-OS tests moved to nightly.yml to avoid macOS/Windows minute costs on every PR
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          $ext = if ($env:GOOS -eq 'windows') { '.exe' } else { '' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ver = $env:GITHUB_SHA.Substring(0, 7)
          go build -ldflags "-s -w -X main.Version=$ver" -o "dist/forge-$env:GOOS-$env:GOARCH$ext" ./cmd/forge
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/forge-*
          if-no-files-found: error
