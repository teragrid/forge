# golangci-lint configuration — DEV-M0-01 / ADR-001
#
# Linters: staticcheck, govet, gosec, errcheck, ineffassign, gocritic
# (per ADR-001 stack baseline). Plus revive for naming and gofmt/goimports
# enforcement so `make lint` is the single source of truth.

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gocritic
    - gofmt
    - goimports
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/teragrid/forge
  gosec:
    excludes:
      # G104 (audit unhandled errors) is already covered by errcheck; keeping
      # both produces noisy duplicate reports.
      - G104

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
